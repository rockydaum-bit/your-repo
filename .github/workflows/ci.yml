name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ENABLE_AUTO_PROMOTE: "0"
      OPENAI_API_KEY: "test-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pytest ruff mypy types-requests coverage pytest-cov

      - name: Run ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy --ignore-missing-imports agents utils tests main.py config.py

      - name: Run tests with coverage (unit tests only)
        run: |
          python -m pytest --maxfail=1 -q -m "not integration" --cov=. --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage threshold
        run: |
          THRESH=$(cat .coverage_threshold | tr -d " \n\r")
          echo "Enforcing coverage threshold: ${THRESH}%"
          python -m pip install --upgrade coverage
          coverage report --fail-under=${THRESH}
