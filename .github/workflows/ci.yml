name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ENABLE_AUTO_PROMOTE: "0"
      OPENAI_API_KEY: "test-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pytest ruff mypy types-requests coverage pytest-cov

      - name: Run ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy --ignore-missing-imports agents utils tests main.py config.py

      - name: Run tests with coverage (unit tests only)
        run: |
          python -m pytest --maxfail=1 -q -m "not integration" --cov=. --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage threshold
        run: |
          THRESH=$(cat .coverage_threshold | tr -d " \n\r")
          echo "Enforcing coverage threshold: ${THRESH}%"
          python -m pip install --upgrade coverage
          coverage report --fail-under=${THRESH}

  inventory_guardrail:
    name: Inventory guardrail (determinism + contract)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (minimal for guardrail)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path -LiteralPath ".\requirements.txt") {
            python -m pip install -r .\requirements.txt
          }
          python -m pip install pytest

      - name: Regenerate inventory + verify no diff
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\generate_repo_inventory.ps1
          git --no-pager diff -- repo_file_list.txt repo_manifest.json
          git diff --exit-code -- repo_file_list.txt repo_manifest.json

      - name: Run inventory contract guardrail test
        shell: pwsh
        run: |
          python -m pytest -q tests/test_repo_inventory_manifest.py
